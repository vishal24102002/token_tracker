<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Token Manager</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <h2 class="mb-4">Create New Token</h2>
    <form method="POST" action="/create">
        <div class="form-group">
            <label for="name">Token Name</label>
            <input type="text" id="name" name="name" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="token_mint">Token Mint Address</label>
            <input type="text" id="token_mint" name="token_mint" class="form-control" required>
        </div>

        <div class="form-group">
            <label for="tradeToken">Trade Token (input mint)</label>
            <select id="tradeToken" name="trade_token" class="form-control" required>
                {% for t in tokens %}
                <option value="{{ t.token_mint }}">{{ t.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-check mb-2">
            <input type="checkbox" class="form-check-input" id="useJupiterPrice">
            <label class="form-check-label" for="useJupiterPrice">Use Jupiter Aggregator Price</label>
        </div>

        <div class="form-group" id="outputMintGroup" style="display: none;">
            <label for="outputMint">Output Token Mint Address</label>
            <input type="text" id="outputMint" class="form-control" placeholder="Enter output token mint">
        </div>

        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" step="any" id="price" name="price" class="form-control" required>
        </div>

        <button type="submit" class="btn btn-primary">Create Token</button>
    </form>

    <hr class="my-5">
    <h3>All Tokens</h3>
    <table class="table table-bordered mt-3">
        <thead>
        <tr>
            <th>Name</th>
            <th>Mint</th>
            <th>Trade Token</th>
            <th>Price</th>
        </tr>
        </thead>
        <tbody>
        {% for token in tokens %}
        <tr>
            <td>{{ token.name }}</td>
            <td>{{ token.token_mint }}</td>
            <td>{{ token.trade_token }}</td>
            <td>{{ token.price }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>

<script>
    const useJupiterCheckbox = document.getElementById('useJupiterPrice');
    const outputMintGroup = document.getElementById('outputMintGroup');
    const outputMintInput = document.getElementById('outputMint');
    const tradeTokenSelect = document.getElementById('tradeToken');
    const priceInput = document.getElementById('price');

    useJupiterCheckbox.addEventListener('change', () => {
        if (useJupiterCheckbox.checked) {
            outputMintGroup.style.display = 'block';
            fetchJupiterPrice(); // Try fetching immediately
        } else {
            outputMintGroup.style.display = 'none';
        }
    });

    tradeTokenSelect.addEventListener('change', () => {
        if (useJupiterCheckbox.checked) fetchJupiterPrice();
    });

    outputMintInput.addEventListener('input', () => {
        if (useJupiterCheckbox.checked) fetchJupiterPrice();
    });

    function fetchJupiterPrice() {
        const inputMint = tradeTokenSelect.value;
        const outputMint = outputMintInput.value.trim();
        const amount = 1000000; // 1 unit in lamports (like 1 USDC)

        if (!inputMint || !outputMint) return;

        const url = `https://quote-api.jup.ag/v6/quote?inputMint=${inputMint}&outputMint=${outputMint}&amount=${amount}`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                if (data && data.data && data.data[0] && data.data[0].outAmount) {
                    const quote = data.data[0].outAmount / 1_000_000;
                    priceInput.value = quote.toFixed(6);
                }
            })
            .catch(err => {
                console.error('Jupiter API error:', err);
            });
    }
</script>
</body>
</html>
